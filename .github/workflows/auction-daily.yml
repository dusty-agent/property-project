name: Daily Nationwide Court Auctions

on:
  workflow_dispatch:

  schedule:
    - cron: "30 7 * * *"
      timezone: "Asia/Seoul"

permissions:
  contents: write

jobs:
  collect-and-publish:
    name: Collect and publish auction data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout property project
        uses: actions/checkout@v4
        with:
          path: property-project

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: property-project/경매/requirements.txt

      - name: Install Python dependencies
        working-directory: property-project/경매
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect nationwide court auctions
        working-directory: property-project/경매
        shell: bash
        env:
          DUSTIE_DATA_DIR: ${{ github.workspace }}/property-project/docs/data
          PYTHONUTF8: "1"
          TZ: Asia/Seoul
        run: |
          for attempt in 1 2 3; do
            echo "Collection attempt ${attempt}/3"

            if python run_daily.py; then
              echo "Collection succeeded."
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              wait_seconds=$((attempt * 60))
              echo "Collection failed."
              echo "Retrying in ${wait_seconds} seconds..."
              sleep "$wait_seconds"
            fi
          done

          echo "Collection failed after 3 attempts."
          exit 1

      - name: Validate generated JSON
        run: |
          test -f property-project/docs/data/auction_latest.json

          python -m json.tool \
            property-project/docs/data/auction_latest.json \
            > /dev/null

          echo "auction_latest.json validation completed."

      - name: Commit public auction data
        working-directory: property-project
        run: |
          git config user.name "dustydraft"
          git config user.email "soyoung@dustydraft.com"

          git add docs/data/auction_latest.json

          if git diff --cached --quiet; then
            echo "No auction data changes to commit."
            exit 0
          fi

          git commit -m "data: update Seoul Central auction listings"
          git push origin main